name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for service in user-service event-service venue-service equipment-service registration-service notification-service; do
            python -m pip install -r "services/${service}/requirements.txt"
          done

      - name: Run unit tests
        run: python scripts/run-unit-coverage.py

      - name: Start MySQL
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Apply database migrations
        run: python scripts/migrate.py --no-seed

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/user-service/requirements.txt
            services/event-service/requirements.txt
            services/venue-service/requirements.txt
            services/equipment-service/requirements.txt
            services/registration-service/requirements.txt
            services/notification-service/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          for service in user-service event-service venue-service equipment-service registration-service notification-service; do
            python -m pip install -r "services/${service}/requirements.txt"
          done

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Write acceptance-test environment
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          web = [
              "VITE_FIREBASE_API_KEY",
              "VITE_FIREBASE_AUTH_DOMAIN",
              "VITE_FIREBASE_PROJECT_ID",
              "VITE_FIREBASE_APP_ID",
          ]
          missing = [name for name in web if not os.environ.get(name)]
          raw = os.environ.get("FIREBASE_CREDENTIALS_JSON", "")
          if not raw.strip():
              missing.append("FIREBASE_CREDENTIALS_JSON")
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: "
                  + ", ".join(missing)
                  + ". Add them under Settings, Secrets and variables, Actions. "
                  "Use the same Firebase project as Test Data/credentials-valid.txt."
              )
          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"FIREBASE_CREDENTIALS_JSON is not valid JSON ({exc}).") from exc
          if not parsed.get("private_key") or not parsed.get("client_email"):
              raise SystemExit(
                  "FIREBASE_CREDENTIALS_JSON must be the Firebase Admin service account key."
              )

          key_path = root / "firebase-adminsdk.ci.json"
          key_path.write_text(raw if raw.endswith("\n") else raw + "\n")
          key_path.chmod(0o600)

          def line(name: str, value: str) -> str:
              if "'" in value or "\n" in value or "\r" in value:
                  raise SystemExit(f"{name} contains a character that cannot be stored in .env")
              return f"{name}='{value}'"

          contents = [line(name, os.environ[name]) for name in web]
          contents.append(line("FIREBASE_CREDENTIALS_PATH", str(key_path)))
          (root / ".env").write_text("\n".join(contents) + "\n")
          PY

      - name: Run acceptance tests
        run: npm run test:acceptance

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
